[versions]
agp = "8.9.1"
kotlin = "2.1.20"
lifecycle = "2.8.7"
coroutines = "1.9.0"
okhttp = "4.12.0"
gson = "2.11.0"
libsu = "6.0.0"

material = "1.11.0"
appcompat = "1.6.1"
core-ktx = "1.12.0"
preference = "1.2.1"
recyclerview = "1.3.2"
fragment = "1.6.2"
viewpager2 = "1.0.0"

[libraries]
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsu" }

# Standard Material / AndroidX
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }

[bundles]
androidx = [
    "material",
    "androidx-appcompat",
    "androidx-core-ktx",
    "androidx-preference",
    "androidx-recyclerview",
    "androidx-fragment",
    "androidx-viewpager2",
]
libsu = ["libsu-core", "libsu-service"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
